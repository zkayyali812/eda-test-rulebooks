---
- name: Controller Event Stream Benchmark
  hosts: all
  sources:
    - name: benchmark_events
      ansible.eda.range:
        limit: 5
  rules:
    - name: Launch demo job template for event i equals one
      # Event Stream posts expose the submitted JSON under event.payload.
      condition: event.payload.i == 1
      action:
        run_job_template:
          name: Demo Job Template
          organization: Default
